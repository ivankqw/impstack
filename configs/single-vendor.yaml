name: single-vendor
summary: Codex owns every role because Claude is unavailable.
when: Use only when the Claude harness is unavailable.
harness: codex
roles:
  orchestrator: { model: gpt-5.6-sol, effort: medium }
  implementer:  { model: gpt-5.6-luna, effort: xhigh, service_tier: default, parallel: true }
  reviewer:     { model: gpt-5.6-terra, effort: medium, cross_vendor: false }
notes: >-
  This is the explicit no-Claude fallback. The reviewer uses different Codex
  weights from the author and starts with no shared context. Require executed
  evidence for every verified claim. Say in the PR that the review used one vendor.
