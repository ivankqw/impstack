name: default
summary: Claude Code plans, Codex implements in Herdr, and Sonnet reviews.
when: Ordinary day-to-day work.
harness: claude-code
roles:
  orchestrator: { model: opus-5, effort: medium }
  implementer:  { model: gpt-5.6-sol, effort: low, fast: false, runtime: herdr, parallel: true }
  reviewer:     { model: sonnet-5, effort: high, fresh_context: true, cross_vendor: true }
notes: >-
  Run each Codex implementer in a Herdr pane. Raise effort only when the operator
  says so. Dispatch the reviewer as a fresh
  Claude Sonnet subagent with no shared context. Never use Opus for a Claude
  subagent. If Claude is unavailable, switch to single-vendor.
